[project]
name = "qualityproof"
version = "0.1.0"
description = "Local-first foundations for traceable software quality evidence"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "QualityProof contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "azure-identity>=1.23",
  "azure-storage-blob>=12.25",
  "azure-storage-queue>=12.13",
  "fastapi>=0.116",
  "httpx>=0.28",
  "playwright>=1.54",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "typer>=0.16",
  "uvicorn>=0.35",
]

[project.scripts]
qualityproof = "qualityproof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "mutmut>=3.7.0",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=7.1.0",
  "pytest-playwright>=0.7",
  "pytest-rerunfailures>=16.6",
  "pytest-xdist>=3.8.0",
  "ruff>=0.12",
  "types-pyyaml>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated by the mutation runner; it is machine-written and intentionally ugly.
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "demo", "scripts"]
exclude = ["^mutants/"]
plugins = ["pydantic.mypy"]

[tool.mutmut]
# Mutation is aimed at the modules that decide what evidence *proves*, not at
# the whole codebase. A surviving mutant in a trust rule means a wrong answer can
# be produced without any test noticing, which is the failure this project exists
# to prevent; a surviving mutant in CLI plumbing is far less interesting.
# The whole package is copied so intra-package imports still resolve, but only
# the trust-critical mutants are executed. See scripts/mutation_report.py for the
# selection patterns and the reasoning.
source_paths = ["src/qualityproof"]
# mutmut runs the suite from a copied source tree that contains only the package,
# so the oracle excludes the three test modules that import `scripts` or `demo`.
# Those cover the benchmark harness and the demo fixture, neither of which is a
# trust rule; the exclusion is recorded in the mutation report.
pytest_add_cli_args_test_selection = [
  "tests/test_api.py",
  "tests/test_audit.py",
  "tests/test_discovery.py",
  "tests/test_dual_language_emission.py",
  "tests/test_execution_policy.py",
  "tests/test_foundation.py",
  "tests/test_interop_contract.py",
  "tests/test_jira_healing_snapshots.py",
  "tests/test_repository_reporting.py",
  "tests/test_scenarios.py",
  "tests/test_snapshot_retargets.py",
  "tests/test_trust_rules.py",
  "-q",
]

[tool.coverage.run]
branch = true
source = ["src/qualityproof"]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "qualityproof(requirements, provenance): static requirement and provenance metadata",
  "browser: requires an installed Playwright browser",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qualityproof", "demo", "scripts"]
